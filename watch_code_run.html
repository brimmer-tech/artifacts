<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line by Line: watch code run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#FBFCFA; --grid:#E6EDF5; --ink:#1B2F55; --muted:#55657B; --card:#FFFFFF; --line:#CAD6E4;
  --hl:#FFE45C; --hl-text:#1B2F55; --hl-edge:#F2CD1F;
  --marker:#C8336A; --marker-soft:#FCE6EE; --mint:#1C7F5E; --mint-soft:#DCF2E9;
  --str:#1C7A58; --num:#7B3BB0; --comment:#7A8797;
  --btn:#1B2F55; --btn-text:#FFFFFF; --focus:#3B82F6;
  --sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#101B29; --grid:#18263A; --ink:#E9EFF7; --muted:#A1B1C5; --card:#15233A; --line:#2C405C;
    --hl:#5C4B06; --hl-text:#FFF4BF; --hl-edge:#C9A512;
    --marker:#FF7FA9; --marker-soft:rgba(255,127,169,.14); --mint:#62D6AB; --mint-soft:rgba(98,214,171,.13);
    --str:#86E3BB; --num:#D4ADFF; --comment:#8193A9;
    --btn:#E9EFF7; --btn-text:#101B29; --focus:#7AB0FF;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#101B29; --grid:#18263A; --ink:#E9EFF7; --muted:#A1B1C5; --card:#15233A; --line:#2C405C;
  --hl:#5C4B06; --hl-text:#FFF4BF; --hl-edge:#C9A512;
  --marker:#FF7FA9; --marker-soft:rgba(255,127,169,.14); --mint:#62D6AB; --mint-soft:rgba(98,214,171,.13);
  --str:#86E3BB; --num:#D4ADFF; --comment:#8193A9;
  --btn:#E9EFF7; --btn-text:#101B29; --focus:#7AB0FF;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--mono)}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1400px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1.5px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto}
.glyph{display:grid;gap:3px;width:26px}
.glyph i{display:block;height:5px;border-radius:3px;background:var(--line)}
.glyph i:nth-child(1){width:70%}
.glyph i:nth-child(2){width:100%;background:var(--hl);box-shadow:inset 0 0 0 1px var(--hl-edge)}
.glyph i:nth-child(3){width:55%}
.mark h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.mark p{margin:0;color:var(--muted);font-size:.92rem}
.picker{display:flex;align-items:center;gap:8px}
.picker label{color:var(--muted);font-size:.92rem}
select{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:260px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--grid)}
.btn.primary{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.btn.primary:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.38;cursor:not-allowed}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:0}
.pane{min-height:0;overflow:auto}
.code-pane{border-right:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column}
.pane-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 18px 6px;color:var(--muted);font-size:.9rem}
.pane-head strong{color:var(--ink);font-size:1rem}

/* code view */
.codeview{font-family:var(--mono);font-size:15px;line-height:1.75;padding:4px 0 24px;counter-reset:ln}
.ln{display:grid;grid-template-columns:3.2em 1fr;cursor:pointer;position:relative}
.ln .num{color:var(--muted);text-align:right;padding-right:14px;user-select:none;opacity:.7}
.ln .src{white-space:pre;padding-right:16px;overflow:hidden;text-overflow:ellipsis}
.ln:hover .src{background:var(--grid)}
.ln.ran .src{background:var(--hl);color:var(--hl-text);border-radius:3px 9px 4px 10px / 7px 4px 9px 4px;box-shadow:inset 0 -3px 0 var(--hl-edge)}
.ln.ran .num{color:var(--ink);opacity:1;font-weight:700}
.ln.ran::before{content:"";position:absolute;left:4px;top:50%;width:0;height:0;border-left:7px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent;transform:translateY(-50%)}
.ln.next .src{outline:2px dashed var(--ink);outline-offset:-2px;border-radius:6px}
.ln.bad .src{background:var(--marker-soft);box-shadow:inset 0 -3px 0 var(--marker);color:var(--ink)}
.tk-kw{font-weight:700}
.tk-str{color:var(--str)}
.tk-num{color:var(--num)}
.tk-com{color:var(--comment);font-style:italic}
.tk-bi{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ran .tk-str,.ran .tk-num,.ran .tk-com{color:inherit}
.code-hint{padding:0 18px 16px;color:var(--muted);font-size:.88rem;margin-top:auto}

/* editor */
.editor{display:grid;grid-template-columns:3.2em 1fr;flex:1;min-height:320px;font-family:var(--mono);font-size:15px;line-height:1.75}
.gutter{color:var(--muted);text-align:right;padding:10px 14px 10px 0;overflow:hidden;user-select:none;opacity:.75;white-space:pre}
.gutter .bad{color:var(--marker);font-weight:700;opacity:1}
textarea{border:0;resize:none;background:transparent;padding:10px 16px 10px 0;outline:none;white-space:pre;overflow:auto;tab-size:4;font-family:var(--mono);font-size:15px;line-height:1.75;min-height:320px}
textarea:focus-visible{outline:none;box-shadow:inset 3px 0 0 var(--focus)}
.syntax{margin:10px 18px 0;padding:12px 14px;border-radius:10px;background:var(--marker-soft);border-left:4px solid var(--marker)}
.syntax strong{display:block}
.syntax[hidden]{display:none}

/* story */
.story-pane{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;padding:20px 26px 28px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;color:var(--muted);font-size:.95rem;margin-bottom:8px}
.meta .count{font-weight:700;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-size:.85rem;color:var(--ink)}
.chip.loop{border-color:var(--mint);color:var(--mint)}
.chip.fn{border-color:var(--ink)}
.chip.err{border-color:var(--marker);color:var(--marker);font-weight:700}
.say{font-size:1.42rem;line-height:1.38;font-weight:700;margin:0 0 14px;max-width:34em;text-wrap:pretty}
.say code{font-weight:700;font-size:.9em;background:var(--card);border:1.5px solid var(--line);padding:0 .3em;border-radius:6px;white-space:nowrap}
.say.error{color:var(--ink);border-left:5px solid var(--marker);padding-left:14px}
.say.guess{font-weight:600;color:var(--ink)}
.say.fresh{animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.work{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 22px;font-family:var(--mono);font-size:.98rem}
.work .lbl{color:var(--muted);font-family:var(--sans);font-size:.9rem;margin-right:4px}
.work .stg{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:3px 9px;white-space:pre-wrap;word-break:break-word}
.work .arr{color:var(--muted)}
.work .stg.final{border:2px solid var(--mint);background:var(--mint-soft);font-weight:700}
.work .gap{color:var(--muted)}

.section-title{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px;font-size:1rem;font-weight:800}
.section-title span{font-weight:400;color:var(--muted);font-size:.88rem}

/* memory */
.frames{display:grid;gap:12px;margin-bottom:24px}
.frame{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px 12px}
.frame.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.frame.waiting{border-style:dashed;opacity:.82}
.frame-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.frame-head b{font-family:var(--mono);font-size:1rem}
.frame-head .status{color:var(--muted);font-size:.85rem}
.vars{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 14px;align-items:center}
.vname{font-family:var(--mono);font-weight:700;text-align:right;padding:4px 0}
.vcell{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;padding:3px 6px;border-radius:8px;border-left:4px solid transparent}
.var-changed{background:var(--marker-soft);border-left-color:var(--marker)}
.var-new{background:var(--mint-soft);border-left-color:var(--mint)}
.note{font-size:.84rem;color:var(--muted)}
.note s{font-family:var(--mono)}
.note.new{color:var(--mint);font-weight:700}
.note.chg{color:var(--marker);font-weight:700}
.prim{font-family:var(--mono);font-size:1rem;background:var(--paper);border:1.5px solid var(--line);border-radius:7px;padding:2px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ty-str{color:var(--str)}
.ty-int,.ty-float{color:var(--num)}
.ty-bool,.ty-NoneType{font-weight:700}
.empty{color:var(--muted);font-size:.9rem;font-style:italic}
.slots{display:flex;flex-wrap:wrap;gap:0;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:stretch;min-width:2.8em}
.slot .sv{border:1.5px solid var(--line);margin-left:-1.5px;padding:3px 8px;text-align:center;background:var(--paper);font-family:var(--mono);min-height:2.1em;display:flex;align-items:center;justify-content:center}
.slot:first-child .sv{margin-left:0;border-radius:7px 0 0 7px}
.slot:last-child .sv{border-radius:0 7px 7px 0}
.slot:only-child .sv{border-radius:7px}
.slot .si{font-size:.72rem;color:var(--muted);text-align:center;font-family:var(--mono);margin-top:2px}
.slot.chg .sv{border-color:var(--marker);background:var(--marker-soft);position:relative;z-index:1}
.slots.tuple .sv{border-style:dashed}
.slot .sv .prim{border:0;padding:0;background:transparent}
.dict{display:grid;grid-template-columns:max-content max-content;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.dict .dk,.dict .dv{padding:3px 10px;font-family:var(--mono);border-top:1px solid var(--line);display:flex;align-items:center}
.dict .dk{border-right:1.5px solid var(--line);color:var(--muted)}
.dict .dk:nth-child(1),.dict .dv:nth-child(2){border-top:0}
.dict .chg{background:var(--marker-soft)}
.dict .prim{border:0;padding:0;background:transparent}
.shared{font-size:.8rem;font-weight:700;border-radius:999px;padding:1px 9px;color:#fff}
.funcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:.86rem;color:var(--muted)}
.funcs code{color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:0 6px}

/* output */
.output{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--mono);white-space:pre-wrap;word-break:break-word;min-height:3.2em;background-image:repeating-linear-gradient(transparent 0 calc(1.75em - 1px),var(--grid) calc(1.75em - 1px) 1.75em);line-height:1.75em}
.output mark{background:var(--hl);color:var(--hl-text);border-radius:3px;padding:0 1px}
.output .none{color:var(--muted);font-family:var(--sans);font-style:italic}

/* guide (edit mode) */
.guide{max-width:36em}
.guide h2{font-size:1.42rem;line-height:1.3;margin:4px 0 12px}
.guide p{margin:0 0 12px}
.guide .small{color:var(--muted);font-size:.93rem}

/* controls */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 22px;border-top:1.5px solid var(--line);background:var(--card)}
.controls .scrub{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--ink);height:28px}
.btn.next{padding:10px 26px;font-size:1.05rem}
.toggle{display:flex;align-items:center;gap:8px;font-size:.93rem;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.keys{color:var(--muted);font-size:.84rem}
.controls[hidden]{display:none}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .stage{grid-template-columns:1fr}
  .code-pane{border-right:0;border-bottom:1.5px solid var(--line);max-height:42vh}
  .code-pane.editing{max-height:none}
  .story-pane{padding:16px 16px 24px}
  .say{font-size:1.22rem}
  .top{padding:12px 16px}
  .mark p{display:none}
  .controls{position:sticky;bottom:0;z-index:5;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .keys{display:none}
  .btn.ends{display:none}
}
@media (prefers-reduced-motion: reduce){ .say.fresh{animation:none} }

/* language switch */
.langs{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;padding:3px;background:var(--card);gap:2px}
.langs button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.langs button:hover:not([aria-pressed="true"]){background:var(--grid);color:var(--ink)}
.vname small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);line-height:1.1}
.vname.this{font-style:italic}
.objcard{border:1.5px solid var(--line);border-radius:9px;background:var(--paper);overflow:hidden}
.objcard .oh{font-size:.8rem;color:var(--muted);padding:2px 10px;border-bottom:1.5px solid var(--line);background:var(--card)}
.objcard .ob{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0}
.objcard .fk,.objcard .fv{padding:3px 10px;font-family:var(--mono);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.objcard .fk{color:var(--muted);border-right:1.5px solid var(--line)}
.objcard .fk:nth-child(1),.objcard .fv:nth-child(2){border-top:0}
.objcard .chg{background:var(--marker-soft)}
.objcard .prim{border:0;padding:0;background:transparent}
.objcard .fk small{font-size:.7rem;color:var(--muted);font-family:var(--sans)}
.ty-uninit{color:var(--muted);font-style:italic;font-family:var(--sans)!important;font-size:.88rem!important}
.gone{grid-column:1/-1;font-size:.84rem;color:var(--muted);margin-top:2px}
.gone code{text-decoration:line-through}
.slots.arraylist .slot:last-child .sv{border-right-style:dashed}
.listkind{font-size:.75rem;color:var(--muted)}
.objcard .fv.chg{box-shadow:inset 3px 0 0 var(--marker);font-weight:700}
.grid2d{border-collapse:collapse;font-family:var(--mono);background:var(--paper)}
.grid2d th{font-weight:400;font-size:.72rem;color:var(--muted);padding:0 6px}
.grid2d td{border:1.5px solid var(--line);padding:3px 10px;text-align:center;min-width:2.4em}
.grid2d td.chg{background:var(--marker-soft);border-color:var(--marker);font-weight:700}
.grid2d td.nocell{border:0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark">
      <div class="glyph" aria-hidden="true"><i></i><i></i><i></i></div>
      <div><h1>Line by Line</h1><p>Watch your code run, one step at a time.</p></div>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="python" aria-pressed="true">Python</button>
      <button data-lang="java" aria-pressed="false">Java</button>
      <button data-lang="js" aria-pressed="false">JavaScript</button>
    </div>
    <div class="picker">
      <label for="examples">Example</label>
      <select id="examples"></select>
    </div>
    <button class="btn primary" id="modeBtn">Watch it run</button>
  </header>

  <main class="stage">
    <section class="pane code-pane" id="codePane" aria-label="Code">
      <div class="pane-head"><strong id="codeTitle">Your code</strong><span id="codeSub"></span></div>
      <div class="syntax" id="syntax" role="alert" hidden></div>
      <div class="editor" id="editorWrap">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea>
      </div>
      <div class="codeview" id="codeview" hidden></div>
      <p class="code-hint" id="codeHint" hidden>Click any line to jump to the next time it runs.</p>
    </section>

    <section class="pane story-pane" id="story" aria-label="What’s happening"></section>
  </main>

  <footer class="controls" id="controls" hidden>
    <button class="btn ends" id="first">Start</button>
    <button class="btn" id="back">Back</button>
    <div class="scrub"><input type="range" id="slider" min="0" max="0" value="0" aria-label="Step"></div>
    <button class="btn primary next" id="next">Next</button>
    <button class="btn ends" id="last">End</button>
    <button class="btn" id="play">Play</button>
    <label class="toggle"><input type="checkbox" id="guess"> Guess first</label>
    <span class="keys">← and → keys work too</span>
  </footer>
</div>

<script>
const PY = (function () {
'use strict';
class SyntaxErr extends Error { constructor(msg, line) { super(msg); this.msg = msg; this.line = line; } }
class PyError extends Error { constructor(type, msg, line) { super(msg); this.type = type; this.msg = msg; this.line = line || null; this.recorded = false; } }
class StepLimit extends Error {}
class Ret { constructor(v) { this.v = v; } }
const BREAK = { sig: 'break' }, CONTINUE = { sig: 'continue' };
const C = s => '\u0001' + s + '\u0001';

const KEYWORDS = new Set(['def','return','if','elif','else','while','for','in','not','and','or','True','False','None','break','continue','pass','is','global','class','import','from','lambda','try','except','with','as','yield','del','assert','raise','nonlocal','finally','async','await']);
const UNSUPPORTED = { class: 'classes', import: 'import', from: 'import', lambda: 'lambda', try: 'try/except', except: 'try/except', finally: 'try/finally', with: 'with', yield: 'yield', raise: 'raise', del: 'del', assert: 'assert', nonlocal: 'nonlocal', async: 'async', await: 'await', as: 'as' };
const OPS = ['**=','//=','==','!=','<=','>=','+=','-=','*=','/=','%=','**','//','->','+','-','*','/','%','<','>','=','(',')','[',']','{','}',',',':','.',';'];
const AUG = new Set(['+=','-=','*=','/=','//=','%=','**=']);

function unescape(s) {
  return s.replace(/\\(.)/gs, (m, ch) => ({ n: '\n', t: '\t', '\\': '\\', "'": "'", '"': '"', r: '\r', '0': '\0', '\n': '' }[ch] ?? m));
}

function tokenize(src, baseLine) {
  const lines = src.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
  const toks = [], indents = [0], opens = [];
  const push = (type, value, line, extra) => toks.push(Object.assign({ type, value, line }, extra || {}));
  let cont = false;
  for (let li = 0; li < lines.length; li++) {
    let line = lines[li], ln = baseLine || li + 1, i = 0, any = false;
    if (opens.length === 0 && !cont) {
      while (i < line.length && line[i] === ' ') i++;
      if (i >= line.length || line[i] === '#') continue;
      if (!baseLine) {
        const top = indents[indents.length - 1];
        if (i > top) { indents.push(i); push('INDENT', null, ln); }
        else if (i < top) {
          while (i < indents[indents.length - 1]) { indents.pop(); push('DEDENT', null, ln); }
          if (i !== indents[indents.length - 1]) throw new SyntaxErr('This line’s indentation doesn’t line up with the lines above it. Use the same number of spaces as the block it belongs to.', ln);
        }
      }
    }
    cont = false;
    while (i < line.length) {
      const c = line[i];
      if (c === ' ') { i++; continue; }
      if (c === '#') break;

/* ---------- unparse ---------- */

    case 'Bool': return n.op === 'and' ? 3 : 2;
    case 'Cmp': return 5;
    case 'Bin': return PREC[n.op];
    case 'Not': case 'Unary': case 'Cast': return 8;
    case 'Inc': return n.prefix ? 8 : 10;
    case 'Num': return (typeof n.v === 'bigint' ? n.v < 0n : n.v < 0) ? 8 : 11;

function unparseAny(n, sub) {

  const w = (c, minP) => { const s = unparseAny(c, sub); const cp = (sub && sub(c) != null) ? 11 : cPrec(c); return cp < minP ? '(' + s + ')' : s; };

    case 'Str': return quoteStr(n.v);

    case 'Const': return n.v === 'UNDEF' ? 'undefined' : anyRepr(n.v);

    case 'This': return 'this';
    case 'List': return n.arr ? '{' + n.elts.map(e => unparseAny(e, sub)).join(', ') + '}' : '[' + n.elts.map(e => unparseAny(e, sub)).join(', ') + ']';

/* ---------- display serialization ---------- */
function serAny(v, seen, depth) {
  seen = seen || new Set(); depth = depth || 0;

    case 'bigint': return prim(anyRepr(v), 'int');
    case 'number': return prim(anyRepr(v), ULANG === 'js' && Number.isInteger(v) ? 'int' : 'float');

    case 'boolean': return prim(anyRepr(v), 'bool');
  }
  if (v.t === 'char') return prim(anyRepr(v), 'str');
  if (v.t === 'list' || v.t === 'tuple') {
    if (seen.has(v.id) || depth > 5) return { k: 'ref', id: v.id, ty: v.t, r: '[...]' };

    seen.delete(v.id); return r;
  }
  if (v.t === 'dict') {
    if (seen.has(v.id) || depth > 5) return { k: 'ref', id: v.id, ty: 'dict', r: '{...}' };

    const ents = [...v.map.values()];

  }
  if (v.t === 'obj') {
    if (seen.has(v.id) || depth > 5) return { k: 'ref', id: v.id, ty: 'obj', r: v.cls.name + ' object' };
    seen.add(v.id);
    const r = { k: 'obj', id: v.id, cls: v.cls.name, fields: [...v.fields].map(([n, b]) => [n, serAny(b.v, seen, depth + 1), b.type || null]) };

}

  } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toWatch(); }
});

/* ---------- languages & examples ---------- */
function fillExamples() {
  el.ex.innerHTML = '';
  EX[S.lang].forEach((x, k) => { const o = document.createElement('option'); o.value = k; o.textContent = x.name; el.ex.appendChild(o); });
  const o = document.createElement('option'); o.value = 'mine'; o.textContent = 'My own code'; el.ex.appendChild(o);
}
function setLang(lang, opts) {
  stopPlay();
  S.lang = lang;
  el.langs.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  el.editor.setAttribute('aria-label', LNAME[lang] + ' code');
  try { localStorage.setItem('lbl-lang', lang); } catch (e) {}
  fillExamples();
  let saved = null;
  try { saved = localStorage.getItem(KEY(lang)); } catch (e) {}
  const match = saved != null ? EX[lang].findIndex(x => x.code === saved) : -1;
  if (saved && saved.trim() && match < 0) { el.editor.value = saved; el.ex.value = 'mine'; S.badLine = null; el.syntax.hidden = true; toEdit(); }
  else { const k = match >= 0 ? match : 0; el.ex.value = k; el.editor.value = EX[lang][k].code; S.badLine = null; el.syntax.hidden = true; toWatch(); }
}
el.langs.forEach(b => b.addEventListener('click', () => { if (b.dataset.lang !== S.lang) setLang(b.dataset.lang); }));
el.ex.addEventListener('change', () => {
  if (el.ex.value === 'mine') { toEdit(); el.editor.focus(); return; }
  el.editor.value = EX[S.lang][+el.ex.value].code; save(); updateGutter(); toWatch();
});
el.editor.addEventListener('input', () => { el.ex.value = 'mine'; });

/* ---------- mode switching ---------- */
function toEdit() {
  stopPlay();
  S.mode = 'edit';
  el.wrap.hidden = false; el.view.hidden = true; el.codeHint.hidden = true; el.controls.hidden = true;
  el.codePane.classList.add('editing');
  el.mode.textContent = 'Watch it run';
  el.codeTitle.textContent = 'Your ' + LNAME[S.lang] + ' code'; el.codeSub.textContent = 'Ctrl+Enter to run';
  renderGuide();
  updateGutter();
}
function toWatch() {
  const src = el.editor.value;
  if (!src.trim()) { if (S.mode !== 'edit') toEdit(); showSyntax(null, 'Type some code first, or pick an example.'); return; }
  let res;
  try { res = PY.run(src, S.lang, { maxSteps: 2000 }); }
  catch (err) { console.error(err); if (S.mode !== 'edit') toEdit(); showSyntax(null, 'The visualizer couldn’t run this program.'); return; }
  if (res.syntaxError) { if (S.mode !== 'edit') toEdit(); showSyntax(res.syntaxError.line, res.syntaxError.msg); return; }
  el.syntax.hidden = true; S.badLine = null;
  S.res = res; S.i = 0; S.pending = false; S.lines = src.replace(/\t/g, '    ').split('\n');
  S.mode = 'watch';
  el.wrap.hidden = true; el.view.hidden = false; el.codeHint.hidden = false; el.controls.hidden = false;
  el.codePane.classList.remove('editing');
  el.mode.textContent = 'Edit code';
  el.codeTitle.textContent = 'Your ' + LNAME[S.lang] + ' code'; el.codeSub.textContent = 'Read only while watching';
  el.slider.max = res.steps.length - 1;
  buildView();
  render(true);
  el.next.focus({ preventScroll: true });
}
function showSyntax(line, msg) {
  S.badLine = line;
  el.syntax.innerHTML = line ? `<strong>${LNAME[S.lang]} can’t read line ${line} yet.</strong>${rich(msg)}` : `<strong>${rich(msg)}</strong>`;
  el.syntax.hidden = false;
  updateGutter();
  if (line) {
    const pos = el.editor.value.split('\n').slice(0, line - 1).join('\n').length + (line > 1 ? 1 : 0);
    el.editor.focus(); el.editor.setSelectionRange(pos, pos);
    const lh = parseFloat(getComputedStyle(el.editor).lineHeight) || 26;
    el.editor.scrollTop = Math.max(0, (line - 3) * lh);
  }
}
el.mode.addEventListener('click', () => S.mode === 'edit' ? toWatch() : toEdit());

function renderGuide() {
  el.story.innerHTML = `<div class="guide">
    <h2>Write some ${LNAME[S.lang]}, then press Watch it run.</h2>
    <p>You’ll step through the program one line at a time. Each step says in plain words what just happened, shows how the computer worked out any math, and marks the variables that changed.</p>
    <p>Turn on <b>Guess first</b> to predict each line before you see what it does.</p>
    ${GUIDE[S.lang]}
  </div>`;
}

/* ---------- watch mode ---------- */
function buildView() {
  const hl = hlLines(S.lines, S.lang);
  el.view.innerHTML = S.lines.map((l, k) => `<div class="ln" data-line="${k + 1}"><span class="num">${k + 1}</span><span class="src">${hl[k]}</span></div>`).join('');
}
el.view.addEventListener('click', e => {
  const row = e.target.closest('.ln'); if (!row) return;
  const ln = +row.dataset.line, steps = S.res.steps;
  stopPlay(); S.pending = false;
  let j = steps.findIndex((s, k) => k > S.i && s.line === ln);
  if (j < 0) j = steps.findIndex(s => s.line === ln);
  if (j >= 0) { S.i = j; render(true); }
});

function serText(v) {
  if (!v) return '';
  if (v.k === 'p' || v.k === 'ref' || v.k === 'key') return v.r;
  if (v.k === 'list') { const inner = v.items.map(serText).join(', ') + (v.more ? ', …' : ''); return v.kind === 'array' ? '{' + inner + '}' : '[' + inner + ']'; }
  if (v.k === 'tuple') return '(' + v.items.map(serText).join(', ') + (v.items.length === 1 ? ',' : '') + ')';
  if (v.k === 'dict') return '{' + v.entries.map(([a, b]) => serText(a) + ': ' + serText(b)).join(', ') + '}';
  if (v.k === 'obj') return v.cls + ' object';
  if (v.k === 'func') return v.name + '(…)';
  if (v.k === 'class') return 'class ' + v.name;
  return '';
}
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const SHARE_COLORS = ['#3563C9', '#B24CB8', '#C2581A', '#1C8A7A', '#7A5BD6'];
const isRef = v => v && (v.k === 'list' || v.k === 'dict' || v.k === 'obj' || v.k === 'ref') && v.ty !== 'tuple';
const kindWord = v => v.k === 'obj' || (v.k === 'ref' && v.ty === 'obj') ? 'object' : v.k === 'dict' ? (v.js ? 'object' : 'dictionary') : v.kind === 'arraylist' ? 'ArrayList' : v.kind === 'list' ? 'list' : 'array';

function collectIds(frames) {
  const counts = new Map(), names = new Map();
  const walk = (v, owner) => {
    if (!v) return;
    if (isRef(v)) {
      counts.set(v.id, (counts.get(v.id) || 0) + 1);
      if (owner) { if (!names.has(v.id)) names.set(v.id, []); names.get(v.id).push(owner); }
    }
    if (v.k === 'list' || v.k === 'tuple') v.items.forEach(x => walk(x, null));
    if (v.k === 'dict') v.entries.forEach(([, x]) => walk(x, null));
    if (v.k === 'obj') v.fields.forEach(([, x]) => walk(x, null));
  };
  frames.forEach(f => f.vars.forEach(x => walk(x.val, x.name)));
  const shared = new Map(); let c = 0;
  for (const [id, n] of counts) if (n > 1) shared.set(id, SHARE_COLORS[c++ % SHARE_COLORS.length]);
  return { shared, names };
}

function renderVal(v, prev, ctx) {
  if (v.k === 'p' || v.k === 'key') return `<span class="prim ty-${v.ty || 'str'}" title="${escH(v.r)}">${escH(clip(v.r, 60))}</span>`;
  if (v.k === 'ref') return `<span class="prim" title="This points back to something already shown">${escH(v.r)}</span>`;
  if (v.k === 'func') return `<span class="prim">${v.arrow ? '(' + escH(v.params.join(', ')) + ') =>' : 'function ' + escH(v.name) + '(' + escH(v.params.join(', ')) + ')'}</span>`;
  if (v.k === 'class') return `<span class="prim">class ${escH(v.name)}</span>`;
  const same = prev && prev.k === v.k && prev.id === v.id;
  let badge = '';
  if (ctx.shared.has(v.id)) badge = `<span class="shared" style="background:${ctx.shared.get(v.id)}" title="More than one name points to this ${kindWord(v)}">shared</span>`;
  if (v.k === 'list' && v.items.length && v.items.every(r => r.k === 'list' && r.items.length && r.items.every(c => c.k === 'p')) && v.items.length <= 20) {
    const cols = Math.max(...v.items.map(r => r.items.length));
    let html = `<table class="grid2d" aria-label="${v.items.length} by ${cols} grid"><thead><tr><th></th>${Array.from({ length: cols }, (_, c) => `<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>`;
    v.items.forEach((row, r) => {
      const pr = same && prev.items[r];
      html += `<tr><th scope="row">${r}</th>` + Array.from({ length: cols }, (_, c) => {
        const cell = row.items[c];
        if (!cell) return '<td class="nocell"></td>';
        const chg = pr && pr.items && JSON.stringify(pr.items[c]) !== JSON.stringify(cell);
        return `<td class="${chg ? 'chg' : ''}">${escH(clip(cell.r, 14))}</td>`;
      }).join('') + '</tr>';
    });
    return html + '</tbody></table>' + badge;
  }
  if (v.k === 'list' || v.k === 'tuple') {
    const word = v.k === 'tuple' ? 'tuple' : kindWord(v);
    if (!v.items.length) return `<span class="empty">empty ${word}</span>${badge}`;
    const cells = v.items.map((x, k) => {
      const chg = same && JSON.stringify(prev.items[k]) !== JSON.stringify(x);
      return `<div class="slot${chg ? ' chg' : ''}"><div class="sv">${renderVal(x, same ? prev.items[k] : null, ctx)}</div><div class="si">${k}</div></div>`;
    }).join('') + (v.more ? `<div class="slot"><div class="sv">+${v.more}</div><div class="si">more</div></div>` : '');
    return `<div class="slots ${v.k === 'tuple' ? 'tuple' : v.kind || ''}" role="list" aria-label="${word} with ${v.items.length + (v.more || 0)} items">${cells}</div>${badge}`;
  }
  if (v.k === 'dict') {
    if (!v.entries.length) return `<span class="empty">empty ${kindWord(v)}</span>${badge}`;
    const pm = new Map(); if (same) prev.entries.forEach(([a, b]) => pm.set(JSON.stringify(a), JSON.stringify(b)));
    const rows = v.entries.map(([a, b]) => {
      const ka = JSON.stringify(a), chg = same && pm.get(ka) !== JSON.stringify(b);
      return `<div class="dk${chg ? ' chg' : ''}">${renderVal(a, null, ctx)}</div><div class="dv${chg ? ' chg' : ''}">${renderVal(b, null, ctx)}</div>`;
    }).join('');
    return `<div class="dict">${rows}</div>${badge}`;
  }
  if (v.k === 'obj') {
    const pm = new Map(); if (same) prev.fields.forEach(([a, b]) => pm.set(a, JSON.stringify(b)));
    const rows = v.fields.length ? v.fields.map(([name, b, type]) => {
      const chg = same && pm.get(name) !== JSON.stringify(b);
      return `<div class="fk${chg ? ' chg' : ''}">${escH(name)}${type ? ` <small>${escH(type)}</small>` : ''}</div><div class="fv${chg ? ' chg' : ''}">${renderVal(b, null, ctx)}</div>`;
    }).join('') : `<div class="fk"><span class="empty">no fields yet</span></div><div class="fv"></div>`;
    return `<div class="objcard"><div class="oh">${escH(v.cls)} object</div><div class="ob">${rows}</div></div>${badge}`;
  }
  return '';
}

function renderMemory(step, prevStep) {
  const ctx = collectIds(step.frames);
  const prevF = new Map();
  if (prevStep) prevStep.frames.forEach(f => prevF.set(f.id, new Map(f.vars.map(x => [x.name, x.val]))));
  const n = step.frames.length;
  const visible = step.frames.map((f, k) => ({ f, k })).filter(({ f }) => !f.hidden);
  return visible.map(({ f, k }) => {
    const active = k === n - 1;
    const pv = prevF.get(f.id);
    const chip = x => x.val.k === 'func' || x.val.k === 'class';
    const funcs = f.id === 0 ? f.vars.filter(chip) : [];
    const vars = f.id === 0 ? f.vars.filter(x => !chip(x)) : f.vars;
    const status = active ? (visible.length > 1 ? 'running now' : '') : `waiting for ${escH(step.frames[k + 1].name)} to finish`;
    const rows = vars.map(x => {
      const before = pv ? pv.get(x.name) : undefined;
      const isNew = prevStep && pv !== undefined && before === undefined;
      const isNewFrame = prevStep && pv === undefined && step.kind === 'call' && active;
      const changed = before !== undefined && JSON.stringify(before) !== JSON.stringify(x.val);
      let note = '';
      if (isNew || isNewFrame) note = '<span class="note new">new</span>';
      else if (changed) {
        const sameObj = before.id !== undefined && before.id === x.val.id;
        note = sameObj ? '<span class="note chg">changed inside</span>' : `<span class="note chg">changed</span> <span class="note">was <s>${escH(clip(serText(before), 24))}</s></span>`;
      }
      const ids = x.val.id !== undefined && ctx.shared.has(x.val.id) ? (ctx.names.get(x.val.id) || []).filter(nm => nm !== x.name) : [];
      if (ids.length) note += ` <span class="note">same ${kindWord(x.val)} as <code>${ids.map(escH).join('</code>, <code>')}</code></span>`;
      const cls = (isNew || isNewFrame) ? ' var-new' : changed ? ' var-changed' : '';
      return `<div class="vname${x.name === 'this' ? ' this' : ''}">${escH(x.name)}${x.type ? `<small>${escH(x.type)}</small>` : ''}</div><div class="vcell${cls}">${renderVal(x.val, before, ctx)}${note}</div>`;
    }).join('');
    let gone = '';
    if (pv) { const names = new Set(f.vars.map(x => x.name)); const g = [...pv.keys()].filter(nm => !names.has(nm)); if (g.length) gone = `<div class="gone">No longer exists: ${g.map(nm => `<code>${escH(nm)}</code>`).join(', ')} (${g.length > 1 ? 'they were' : 'it was'} only inside a block that ended)</div>`; }
    const body = rows || gone ? `<div class="vars">${rows}${gone}</div>` : `<div class="empty">${f.id === 0 ? 'No variables yet.' : 'No variables here yet.'}</div>`;
    const fl = funcs.length ? `<div class="funcs">Saved for later: ${funcs.map(x => `<code>${x.val.k === 'class' ? 'class ' + escH(x.val.name) : escH(x.name) + '(' + escH(x.val.params.join(', ')) + ')'}</code>`).join(' ')}</div>` : '';
    const title = escH(f.title);
    return `<div class="frame ${active ? 'active' : 'waiting'}" style="${f.id ? `margin-left:${Math.min(k, 6) * 14}px` : ''}">
      <div class="frame-head"><b>${title}</b><span class="status">${status}</span></div>${body}${fl}</div>`;
  }).join('');
}

function renderOutput(step, prevStep) {
  const all = S.res.out.slice(0, step.out);
  if (!all) return '<span class="none">Nothing printed yet.</span>';
  const from = prevStep ? Math.min(prevStep.out, step.out) : step.out;
  const fresh = all.slice(from);
  return escH(all.slice(0, from)) + (fresh ? '<mark>' + escH(fresh) + '</mark>' : '');
}

function render(animate) {
  const steps = S.res.steps, i = S.i, step = steps[i], prev = i > 0 ? steps[i - 1] : null;
  const total = steps.length - 1;
  const pending = S.pending && i < total ? steps[i + 1] : null;

  el.view.querySelectorAll('.ln').forEach(r => r.classList.remove('ran', 'next', 'bad'));
  const mark = (ln, cls) => { const r = ln && el.view.querySelector(`.ln[data-line="${ln}"]`); if (r) { r.classList.add(cls); return r; } return null; };
  const focusRow = pending ? mark(pending.line, 'next') : mark(step.line, step.kind === 'error' ? 'bad' : 'ran');
  if (focusRow) focusRow.scrollIntoView({ block: 'nearest' });

  let chips = '';
  if (step.loop && !pending) chips += `<span class="chip loop">Time ${step.loop.pass} through the loop</span>`;
  if (step.kind === 'call' && !pending) chips += `<span class="chip fn">Into a ${S.lang === 'java' ? 'method' : 'function'}</span>`;
  if (step.kind === 'return' && !pending) chips += `<span class="chip fn">Leaving a ${S.lang === 'java' ? 'method' : 'function'}</span>`;
  if (step.kind === 'error') chips += `<span class="chip err">${escH(step.err.type)}</span>`;
  const where = pending ? `Line ${pending.line ?? ''} is next` : step.kind === 'start' ? 'Ready' : step.kind === 'end' ? 'Finished' : step.kind === 'error' ? `Stopped on line ${step.line}` : `Line ${step.line} just ran`;
  const count = i === 0 ? `${total} step${total === 1 ? '' : 's'} in this program` : `Step ${i} of ${total}`;

  let say, work = '';
  if (pending) {
    say = `<p class="say guess${animate ? ' fresh' : ''}">${pending.kind === 'end' ? 'There’s nothing left to run. What do you think the program printed in total?' : `Line ${pending.line} runs next. What do you think it will do? Make your guess, then press Check.`}</p>`;
  } else {
    say = `<p class="say${step.kind === 'error' ? ' error' : ''}${animate ? ' fresh' : ''}">${rich(step.text)}</p>`;
    if (step.work) {
      const st = step.work.stages;
      work = `<div class="work" aria-label="How it was worked out">${step.work.label ? `<span class="lbl">${escH(step.work.label)}</span>` : ''}${st.map((s, k) => (k ? '<span class="arr" aria-hidden="true">→</span>' : '') + (s === '…' ? '<span class="gap">…</span>' : `<span class="stg${k === st.length - 1 ? ' final' : ''}">${escH(s)}</span>`)).join('')}</div>`;
    }
  }
  el.story.innerHTML = `
    <div class="meta"><span class="count">${count}</span><span>${where}</span>${chips}</div>
    <div aria-live="polite">${say}${work}</div>
    <h2 class="section-title">Memory <span>${pending ? 'as it is now' : 'after this step'}</span></h2>
    <div class="frames">${renderMemory(step, pending ? null : prev)}</div>
    <h2 class="section-title">Printed output</h2>
    <div class="output">${renderOutput(step, pending ? null : prev)}</div>`;

  el.slider.value = i;
  el.back.disabled = el.first.disabled = i === 0 && !S.pending;
  el.next.disabled = el.last.disabled = i >= total;
  el.next.textContent = i >= total ? 'Done' : pending ? 'Check' : 'Next';
  el.play.textContent = S.timer ? 'Pause' : 'Play';
}

function go(j) { const t = S.res.steps.length - 1; S.i = Math.max(0, Math.min(t, j)); S.pending = false; render(true); }
function nextStep() {
  const t = S.res.steps.length - 1;
  if (S.i >= t) return;
  if (el.guess.checked && !S.pending && !S.timer) { S.pending = true; render(true); return; }
  go(S.i + 1);
}
function backStep() { if (S.pending) { S.pending = false; render(false); return; } go(S.i - 1); }
el.next.addEventListener('click', () => { stopPlay(); nextStep(); });
el.back.addEventListener('click', () => { stopPlay(); backStep(); });
el.first.addEventListener('click', () => { stopPlay(); go(0); });
el.last.addEventListener('click', () => { stopPlay(); go(Infinity); });
el.slider.addEventListener('input', () => { stopPlay(); go(+el.slider.value); });
el.guess.addEventListener('change', () => { if (!el.guess.checked && S.pending) { S.pending = false; render(false); } });
function stopPlay() { if (S.timer) { clearInterval(S.timer); S.timer = null; el.play.textContent = 'Play'; } }
el.play.addEventListener('click', () => {
  if (S.timer) { stopPlay(); return; }
  if (S.i >= S.res.steps.length - 1) go(0);
  S.pending = false;
  S.timer = setInterval(() => { if (S.i >= S.res.steps.length - 1) { stopPlay(); render(false); return; } go(S.i + 1); }, 1100);
  render(false);
});
document.addEventListener('keydown', e => {
  if (S.mode !== 'watch' || e.target.closest('textarea,select,input[type=text]') || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); stopPlay(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stopPlay(); backStep(); }
  else if (e.key === 'Home') { e.preventDefault(); stopPlay(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); stopPlay(); go(Infinity); }
});

let startLang = 'python';
try { const l = localStorage.getItem('lbl-lang'); if (l && EX[l]) startLang = l; } catch (e) {}
setLang(startLang);
})();

</script>
</body>
</html>
