<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fractal Tree Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#f7f5f0; --panel:#ffffff; --ink:#15130f; --ink-2:#4a463f; --ink-3:#8a857b;
  --line:#dcd8cf; --moss:#3f6b4a; --moss-soft:#e4ede6; --bark:#6b4a2a;
  --code-bg:#1c1a16; --code-fg:#e8e3d8; --kw:#c9a86a; --fn:#9ccf9c; --num:#e3b57a; --cm:#8a857b; --str:#d9a0a0;
  --focus:#3f6b4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#15130f; --panel:#1f1c17; --ink:#efe9dd; --ink-2:#c3bcb0; --ink-3:#7f786d;
    --line:#332f28; --moss:#86b791; --moss-soft:#263328; --bark:#b8906a;
    --code-bg:#0f0e0b; --code-fg:#e8e3d8;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#15130f; --panel:#1f1c17; --ink:#efe9dd; --ink-2:#c3bcb0; --ink-3:#7f786d;
  --line:#332f28; --moss:#86b791; --moss-soft:#263328; --bark:#b8906a;
  --code-bg:#0f0e0b; --code-fg:#e8e3d8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; height:100%; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.5;}
button,input,select{font:inherit; color:inherit}

header{display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
  padding:1.1rem 1.5rem .9rem; border-bottom:1px solid var(--line); flex-wrap:wrap}
h1{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.55rem; margin:0; letter-spacing:-.01em}
h1 small{font-family:"IBM Plex Sans",system-ui,sans-serif; font-weight:400; font-size:.9rem; color:var(--ink-3); margin-left:.6rem}
.toolbar{display:flex; gap:.5rem; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:.4rem .8rem; cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--moss); color:#fff; border-color:var(--moss)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* Three columns: controls | tree | code. Controls sit beside the tree so both stay in view. */
main{display:grid; grid-template-columns:270px minmax(0,1.2fr) minmax(0,1fr); height:calc(100% - 64px); min-height:520px}
main.code-hidden{grid-template-columns:270px minmax(0,1fr)}
main.code-hidden #codePane{display:none}

.stage{display:contents}
.canvas-wrap{position:relative; background:var(--panel); min-height:420px; border-right:1px solid var(--line)}
main.code-hidden .canvas-wrap{border-right:none}
canvas{display:block; width:100%; height:100%}
.caption{position:absolute; left:0; right:0; bottom:.6rem; text-align:center; color:var(--ink-3); font-size:.85rem; pointer-events:none}

.controls{order:-1; padding:.9rem 1.1rem 1.2rem; border-right:1px solid var(--line); display:flex; flex-direction:column;
  gap:.55rem; overflow-y:auto; font-size:.9rem}
.ctl{display:grid; grid-template-columns:1fr auto; gap:0 .5rem; align-items:center}
.ctl label{color:var(--ink-2)}
.ctl input[type=range]{margin:.1rem 0 0}
.ctl output{font-family:"IBM Plex Mono",monospace; font-size:.85rem; color:var(--ink); min-width:3.5ch; text-align:right}
.ctl input[type=range]{grid-column:1/-1; width:100%; accent-color:var(--moss)}
.ctl select{grid-column:1/-1; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:.35rem .5rem}
.presets{display:flex; gap:.4rem; flex-wrap:wrap; align-items:center}
.presets span{color:var(--ink-3); margin-right:.25rem}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:.2rem .65rem; cursor:pointer; font-size:.85rem}
.rule{border:0; border-top:1px solid var(--line); margin:.3rem 0}
#status{color:var(--ink-3); font-size:.82rem; width:100%}
.chip:hover{background:var(--moss-soft); border-color:var(--moss)}
.check{display:flex; align-items:center; gap:.5rem; color:var(--ink-2)}
.check input{accent-color:var(--moss)}

#codePane{display:flex; flex-direction:column; background:var(--code-bg); color:var(--code-fg); min-width:0}
.code-head{display:flex; justify-content:space-between; align-items:center; padding:.75rem 1.25rem; border-bottom:1px solid #2c2923; color:#a8a194; font-size:.85rem}
.code-head .file{font-family:"IBM Plex Mono",monospace; color:var(--code-fg)}
.code-head .btn{background:transparent; border-color:#3a362e; color:var(--code-fg)}
pre{margin:0; padding:1.1rem 1.25rem 1.5rem; overflow:auto; flex:1; font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:.82rem; line-height:1.6; tab-size:4}
.kw{color:var(--kw)} .fn{color:var(--fn)} .num{color:var(--num)} .cm{color:var(--cm); font-style:italic} .str{color:var(--str)}
.hint{padding:.75rem 1.25rem 1rem; color:#a8a194; font-size:.82rem; border-top:1px solid #2c2923}

/* Mid widths: controls beside the tree, code below spanning the full width */
@media (max-width:1100px){
  main{grid-template-columns:260px minmax(0,1fr); height:auto}
  .canvas-wrap{border-right:none; height:min(70vh, 640px)}
  .controls{max-height:min(70vh, 640px)}
  #codePane{grid-column:1/-1; border-top:1px solid var(--line)}
  pre{max-height:60vh}
}
/* Phones: stack everything, tree first */
@media (max-width:700px){
  main{grid-template-columns:minmax(0,1fr)}
  .controls{order:0; max-height:none; border-right:none; border-top:1px solid var(--line)}
  .canvas-wrap{height:60vh; min-height:340px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<header>
  <h1>Fractal Tree Lab <small>recursion you can see</small></h1>
  <div class="toolbar">
    <button class="btn" id="randomBtn">New random seed</button>
    <button class="btn" id="themeBtn">Light / dark</button>
    <button class="btn" id="saveBtn">Save PNG</button>
    <button class="btn primary" id="toggleCode" aria-pressed="true">Hide Python</button>
  </div>
</header>

<main id="main">
  <section class="stage">
    <div class="canvas-wrap">
      <canvas id="c" aria-label="Fractal tree drawing"></canvas>
      <div class="caption" id="caption">Fig. Fractal Tree</div>
    </div>
    <div class="controls">
      <div class="presets">
        <span>Presets</span>
        <button class="chip" data-preset="classic">Classic</button>
        <button class="chip" data-preset="oak">Oak</button>
        <button class="chip" data-preset="pine">Pine</button>
        <button class="chip" data-preset="willow">Willow</button>
        <button class="chip" data-preset="wind">Windblown</button>
        <button class="chip" data-preset="broccoli">Broccoli</button>
      </div>
      <hr class="rule">

      <div class="ctl"><label for="depth">Recursion depth</label><output id="depthV"></output>
        <input type="range" id="depth" min="1" max="13" step="1"></div>
      <div class="ctl"><label for="angle">Branch angle</label><output id="angleV"></output>
        <input type="range" id="angle" min="5" max="90" step="1"></div>
      <div class="ctl"><label for="ratio">Length ratio</label><output id="ratioV"></output>
        <input type="range" id="ratio" min="0.4" max="0.85" step="0.01"></div>
      <div class="ctl"><label for="branches">Branches per split</label><output id="branchesV"></output>
        <input type="range" id="branches" min="2" max="4" step="1"></div>
      <div class="ctl"><label for="jitter">Angle randomness</label><output id="jitterV"></output>
        <input type="range" id="jitter" min="0" max="40" step="1"></div>
      <div class="ctl"><label for="lenJitter">Length randomness</label><output id="lenJitterV"></output>
        <input type="range" id="lenJitter" min="0" max="40" step="1"></div>
      <div class="ctl"><label for="lean">Lean (wind)</label><output id="leanV"></output>
        <input type="range" id="lean" min="-30" max="30" step="1"></div>
      <div class="ctl"><label for="trunk">Trunk length</label><output id="trunkV"></output>
        <input type="range" id="trunk" min="60" max="220" step="1"></div>
      <div class="ctl"><label for="width">Trunk width</label><output id="widthV"></output>
        <input type="range" id="width" min="2" max="30" step="1"></div>
      <div class="ctl"><label for="color">Color style</label><output></output>
        <select id="color">
          <option value="ink">Ink (black)</option>
          <option value="bark">Bark to leaf</option>
          <option value="depth">Depth gradient</option>
        </select></div>
      <label class="check"><input type="checkbox" id="leaves"> Draw leaves at the tips</label>
      <hr class="rule">
      <div class="ctl"><label for="speed">Turtle speed</label><output id="speedV"></output>
        <input type="range" id="speed" min="1" max="10" step="1" value="5"></div>
      <div class="presets" style="gap:.5rem">
        <button class="btn primary" id="watchBtn">Watch the turtle draw</button>
        <button class="btn" id="stopBtn">Finish instantly</button>
        <span id="status"></span>
      </div>
    </div>
  </section>

  <aside id="codePane" aria-label="Python code">
    <div class="code-head">
      <span class="file">fractal_tree.py</span>
      <span>Updates as you move the sliders</span>
      <button class="btn" id="copyBtn">Copy</button>
    </div>
    <pre id="code"></pre>
    <div class="hint">Runs with Python’s built-in <code>turtle</code> module — no installs. Paste into IDLE or any editor and run.</div>
  </aside>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const params = { depth:9, angle:25, ratio:0.72, branches:2, jitter:0, lenJitter:0, lean:0, trunk:140, width:12, color:'ink', leaves:false };
  let speed = 5;
  const buf = document.createElement('canvas'), bctx = buf.getContext('2d');
  let seed = 7;

  const presets = {
    classic:  { depth:9,  angle:25, ratio:0.72, branches:2, jitter:0,  lenJitter:0,  lean:0,   trunk:140, width:12, color:'ink',   leaves:false },
    oak:      { depth:10, angle:28, ratio:0.74, branches:2, jitter:18, lenJitter:14, lean:0,   trunk:120, width:16, color:'ink',   leaves:false },
    pine:     { depth:8,  angle:70, ratio:0.62, branches:2, jitter:4,  lenJitter:4,  lean:0,   trunk:200, width:10, color:'depth', leaves:false },
    willow:   { depth:9,  angle:40, ratio:0.80, branches:3, jitter:12, lenJitter:10, lean:0,   trunk:100, width:10, color:'bark',  leaves:true },
    wind:     { depth:9,  angle:22, ratio:0.73, branches:2, jitter:14, lenJitter:10, lean:18,  trunk:130, width:12, color:'ink',   leaves:false },
    broccoli: { depth:6,  angle:30, ratio:0.68, branches:4, jitter:6,  lenJitter:6,  lean:0,   trunk:110, width:20, color:'bark',  leaves:true },
  };

  // Deterministic PRNG so the same seed gives the same tree (mirrors random.seed in Python)
  function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- Drawing ----------
  let segments = [], drawToken = 0;

  function buildTree(){
    segments = [];
    const rnd = mulberry32(seed);
    const p = params;
    const rec = (x, y, len, ang, depth, w) => {
      if (depth === 0) return;
      const x2 = x + Math.cos(ang) * len, y2 = y - Math.sin(ang) * len;
      segments.push({ x, y, x2, y2, w, depth, tip: depth === 1 });
      const n = p.branches, spread = p.angle * Math.PI / 180;
      for (let i = 0; i < n; i++){
        const t = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;      // -1 .. 1 across the fan
        let a = ang + t * spread + (p.lean * Math.PI / 180);
        a += (rnd() * 2 - 1) * p.jitter * Math.PI / 180;
        const l = len * p.ratio * (1 + (rnd() * 2 - 1) * p.lenJitter / 100);
        rec(x2, y2, l, a, depth - 1, Math.max(0.6, w * 0.7));
      }
    };
    rec(0, 0, p.trunk, Math.PI / 2, p.depth, p.width);
  }

  function strokeFor(s, maxDepth){
    const t = 1 - (s.depth - 1) / Math.max(1, maxDepth - 1);   // 0 trunk .. 1 tips
    if (params.color === 'ink') return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    if (params.color === 'bark') { const c1=[107,74,42], c2=[88,140,96]; return `rgb(${c1.map((v,i)=>Math.round(v+(c2[i]-v)*t)).join(',')})`; }
    const h = 20 + t * 140, l = 28 + t * 20; return `hsl(${h} 45% ${l}%)`;
  }

  // Fit the tree into the canvas; returns scale + offsets. Also sizes both canvases.
  function layout(){
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== W * dpr || canvas.height !== H * dpr){ canvas.width = W * dpr; canvas.height = H * dpr; buf.width = W * dpr; buf.height = H * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let minX = 0, maxX = 0, minY = 0, maxY = 0;
    for (const s of segments){ minX = Math.min(minX, s.x2); maxX = Math.max(maxX, s.x2); minY = Math.min(minY, s.y2); maxY = Math.max(maxY, s.y2); }
    const pad = 40, bw = maxX - minX || 1, bh = maxY - minY || 1;
    const scale = Math.min((W - pad * 2) / bw, (H - pad * 2 - 30) / bh, 2.2);
    return { W, H, scale, ox: W / 2 - ((minX + maxX) / 2) * scale, oy: (H - 30) / 2 - ((minY + maxY) / 2) * scale };
  }

  // Draw one segment (optionally only the first `frac` of it) onto a context
  function drawSeg(c, L, s, frac = 1){
    const x1 = L.ox + s.x * L.scale, y1 = L.oy + s.y * L.scale;
    const x2 = x1 + (L.ox + s.x2 * L.scale - x1) * frac, y2 = y1 + (L.oy + s.y2 * L.scale - y1) * frac;
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.strokeStyle = strokeFor(s, params.depth); c.lineWidth = Math.max(0.5, s.w * L.scale);
    c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
    if (frac === 1 && params.leaves && s.tip){
      c.beginPath(); c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--moss').trim(); c.globalAlpha = .75;
      c.arc(x2, y2, Math.max(1.5, 3 * L.scale), 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
    }
    return { x2, y2 };
  }

  // The turtle itself: a small arrowhead at the pen, pointing along the branch
  function drawTurtle(c, x, y, heading){
    const moss = getComputedStyle(document.documentElement).getPropertyValue('--moss').trim();
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    c.save(); c.translate(x, y); c.rotate(-heading);
    c.beginPath(); c.moveTo(14, 0); c.lineTo(-8, 8); c.lineTo(-4, 0); c.lineTo(-8, -8); c.closePath();
    c.fillStyle = moss; c.strokeStyle = ink; c.lineWidth = 1.5; c.fill(); c.stroke();
    c.restore();
  }

  function render(){
    drawToken++; $('status').textContent = '';
    const L = layout();
    ctx.clearRect(0, 0, L.W, L.H);
    segments.forEach(s => drawSeg(ctx, L, s));
  }

  // Walk the segments in the exact order Python's recursion visits them (depth-first),
  // showing the turtle moving along each branch and jumping (pen up) to the next.
  function watchTurtle(){
    const token = ++drawToken;
    const L = layout();
    bctx.clearRect(0, 0, L.W, L.H); ctx.clearRect(0, 0, L.W, L.H);
    // speed 1 = crawl along each branch; speed 10 = many branches per frame
    const rates = [0.04, 0.08, 0.16, 0.33, 0.6, 1, 2, 4, 8, 16];
    let i = 0, frac = 0;
    const total = segments.length;
    const frame = () => {
      if (token !== drawToken) return;
      let budget = rates[speed - 1];
      while (budget > 0 && i < total){
        const s = segments[i];
        const step = Math.min(1 - frac, budget);
        frac += step; budget -= step;
        if (frac >= 1 - 1e-9){ drawSeg(bctx, L, s); i++; frac = 0; }
      }
      ctx.clearRect(0, 0, L.W, L.H);
      ctx.drawImage(buf, 0, 0, L.W, L.H);
      if (i < total){
        const s = segments[i];
        const tip = drawSeg(ctx, L, s, Math.max(frac, 0.001));
        drawTurtle(ctx, tip.x2, tip.y2, Math.atan2(s.y - s.y2, s.x2 - s.x));
        $('status').textContent = `branch ${i + 1} of ${total} — depth ${params.depth - s.depth + 1} of ${params.depth}`;
        requestAnimationFrame(frame);
      } else {
        $('status').textContent = `done — ${total} branches, ${total} calls to branch()`;
      }
    };
    requestAnimationFrame(frame);
  }

  function update(){
    for (const k of ['depth','angle','ratio','branches','jitter','lenJitter','lean','trunk','width']) $(k + 'V').textContent = fmt(k, params[k]);
    $('speedV').textContent = speed;
    $('caption').textContent = `Fig. Fractal Tree — depth ${params.depth}, ${params.branches} branches, ${params.angle}°, seed ${seed}`;
    buildTree(); render(); renderCode();
  }
  const fmt = (k, v) => k === 'ratio' ? Number(v).toFixed(2) : (k === 'angle' || k === 'jitter' || k === 'lean') ? v + '°' : k === 'lenJitter' ? v + '%' : v;

  // ---------- Live Python ----------
  function renderCode(){
    const p = params;
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const kw = s => `<span class="kw">${s}</span>`, fn = s => `<span class="fn">${s}</span>`, num = s => `<span class="num">${s}</span>`, cm = s => `<span class="cm">${esc(s)}</span>`, str = s => `<span class="str">${esc(s)}</span>`;
    const colorLines = p.color === 'ink'
      ? [`    t.pencolor(${str('"black"')})`]
      : p.color === 'bark'
      ? [`    ${cm('# fade from bark brown at the trunk to leaf green at the tips')}`,
         `    frac = ${num('1')} - (depth - ${num('1')}) / ${kw('max')}(${num('1')}, DEPTH - ${num('1')})`,
         `    t.pencolor(${num('107')} + (${num('88')} - ${num('107')}) * frac, ${num('74')} + (${num('140')} - ${num('74')}) * frac, ${num('42')} + (${num('96')} - ${num('42')}) * frac)`]
      : [`    ${cm('# hue shifts with depth')}`,
         `    frac = ${num('1')} - (depth - ${num('1')}) / ${kw('max')}(${num('1')}, DEPTH - ${num('1')})`,
         `    t.pencolor(colorsys.hls_to_rgb((${num('20')} + ${num('140')} * frac) / ${num('360')}, ${num('0.28')} + ${num('0.2')} * frac, ${num('0.45')}))`];
    const jitterA = p.jitter ? ` + random.uniform(-JITTER, JITTER)` : '';
    const jitterL = p.lenJitter ? ` * (${num('1')} + random.uniform(-LEN_JITTER, LEN_JITTER))` : '';
    const leanTxt = p.lean ? ` + LEAN` : '';
    const lines = [
      `${kw('import')} turtle`,
      `${kw('import')} random` + (p.color === 'depth' ? `\n${kw('import')} colorsys` : ''),
      ``,
      `${cm('# ---- settings (change these and re-run) ----')}`,
      `DEPTH      = ${num(p.depth)}      ${cm('# how many times a branch splits')}`,
      `ANGLE      = ${num(p.angle)}     ${cm('# half-spread of the fan, in degrees')}`,
      `RATIO      = ${num(p.ratio.toFixed(2))}   ${cm('# each child is this fraction of its parent')}`,
      `BRANCHES   = ${num(p.branches)}      ${cm('# children per split')}`,
      `TRUNK_LEN  = ${num(p.trunk)}`,
      `TRUNK_W    = ${num(p.width)}`,
      `JITTER     = ${num(p.jitter)}      ${cm('# random wobble added to each angle (deg)')}`,
      `LEN_JITTER = ${num((p.lenJitter/100).toFixed(2))}   ${cm('# random wobble on length (fraction)')}`,
      `LEAN       = ${num(p.lean)}      ${cm('# constant tilt, like wind (deg)')}`,
      `LEAVES     = ${kw(p.leaves ? 'True' : 'False')}`,
      `SEED       = ${num(seed)}      ${cm('# same seed -> same tree')}`,
      ``,
      `random.seed(SEED)`,
      `screen = turtle.Screen()`,
      `screen.setup(${num('900')}, ${num('900')})`,
      `screen.tracer(${num('0')})           ${cm('# draw instantly; use tracer(1) to watch it grow')}`,
      `t = turtle.Turtle(visible=${kw('False')})`,
      ``,
      `${kw('def')} ${fn('branch')}(x, y, length, heading, depth, width):`,
      `    ${str('"""Draw one branch, then recursively draw its children."""')}`,
      `    ${kw('if')} depth == ${num('0')}:`,
      `        ${kw('return')}                 ${cm('# base case: nothing left to draw')}`,
      `    t.penup(); t.goto(x, y); t.setheading(heading); t.pendown()`,
      `    t.pensize(width)`,
      ...colorLines,
      `    t.forward(length)`,
      `    end_x, end_y = t.position()`,
      ``,
      `    ${kw('if')} LEAVES ${kw('and')} depth == ${num('1')}:`,
      `        t.dot(${num('6')}, ${str('"forest green"')})`,
      ``,
      `    ${cm('# fan the children evenly from -ANGLE to +ANGLE')}`,
      `    ${kw('for')} i ${kw('in')} ${kw('range')}(BRANCHES):`,
      `        spread = (i / (BRANCHES - ${num('1')})) * ${num('2')} - ${num('1')}   ${cm('# -1 .. 1')}`,
      `        new_heading = heading + spread * ANGLE${leanTxt}${jitterA}`,
      `        new_length  = length * RATIO${jitterL}`,
      `        branch(end_x, end_y, new_length, new_heading, depth - ${num('1')}, ${kw('max')}(${num('1')}, width * ${num('0.7')}))`,
      ``,
      `${cm('# the trunk starts at the bottom, pointing straight up (90 degrees)')}`,
      `branch(${num('0')}, -${num('380')}, TRUNK_LEN, ${num('90')}, DEPTH, TRUNK_W)`,
      `screen.update()`,
      `turtle.done()`,
    ];
    $('code').innerHTML = lines.join('\n');
  }

  // ---------- Wiring ----------
  const sliders = ['depth','angle','ratio','branches','jitter','lenJitter','lean','trunk','width'];
  sliders.forEach(k => { const el = $(k); el.value = params[k]; el.addEventListener('input', () => { params[k] = parseFloat(el.value); update(); }); });
  $('color').addEventListener('change', e => { params.color = e.target.value; update(); });
  $('leaves').addEventListener('change', e => { params.leaves = e.target.checked; update(); });
  $('speed').addEventListener('input', e => { speed = parseInt(e.target.value, 10); $('speedV').textContent = speed; });
  $('watchBtn').addEventListener('click', watchTurtle);
  $('stopBtn').addEventListener('click', render);
  $('themeBtn').addEventListener('click', () => {
    const r = document.documentElement, dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = dark ? 'light' : 'dark'; render();
  });
  $('randomBtn').addEventListener('click', () => { seed = Math.floor(Math.random() * 9999) + 1; update(); });
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    Object.assign(params, presets[b.dataset.preset]);
    sliders.forEach(k => $(k).value = params[k]); $('color').value = params.color; $('leaves').checked = params.leaves; update();
  }));
  $('toggleCode').addEventListener('click', e => {
    const hidden = $('main').classList.toggle('code-hidden');
    e.currentTarget.textContent = hidden ? 'Show Python' : 'Hide Python';
    e.currentTarget.setAttribute('aria-pressed', String(!hidden));
    render();
  });
  $('copyBtn').addEventListener('click', async e => {
    try { await navigator.clipboard.writeText($('code').innerText); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1400); }
    catch { e.target.textContent = 'Select and copy manually'; }
  });
  $('saveBtn').addEventListener('click', () => {
    const a = document.createElement('a'); a.download = `fractal-tree-seed${seed}.png`; a.href = canvas.toDataURL('image/png'); a.click();
  });
  new ResizeObserver(() => render()).observe(canvas.parentElement);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

  update();
})();
</script>
</body>
</html>
