<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F3FF;--card:#FFFFFF;--soft:#EEEBFC;--ink:#1E1B3A;--muted:#5C5878;--line:#D9D4F0;
  --violet:#5B3FFF;--violet-ink:#FFFFFF;--sun:#FFC93C;--mint:#11865C;--coral:#C8303F;
  --code:#1E1B3A;--code-ink:#ECE9FF;--code-dim:#9C97C4;--k:#FFC93C;--ty:#7EE2C9;--str:#FF9EC7;--num:#9FC2FF;
  --hot:rgba(255,201,60,.16);
  --head:'Bricolage Grotesque',system-ui,sans-serif;--body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14122A;--card:#1E1B38;--soft:#29254A;--ink:#EEEBFF;--muted:#A9A4CC;--line:#383360;
  --violet:#8C78FF;--violet-ink:#14122A;--mint:#4CD39B;--coral:#FF7A85;--code:#0E0C1F;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14122A;--card:#1E1B38;--soft:#29254A;--ink:#EEEBFF;--muted:#A9A4CC;--line:#383360;
  --violet:#8C78FF;--violet-ink:#14122A;--mint:#4CD39B;--coral:#FF7A85;--code:#0E0C1F;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
code,.mono{font-family:var(--mono)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}

header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.logo{font-size:40px;line-height:1;width:64px;height:64px;display:grid;place-items:center;background:var(--sun);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-4deg)}
h1{font-family:var(--head);font-size:clamp(28px,4vw,40px);font-weight:800;margin:0;line-height:1.05;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted)}

.steps{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0;margin:0 0 14px}
.steps button{width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--muted)}
.steps button:disabled{cursor:not-allowed;opacity:.55}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);margin-bottom:6px}
.steps .done .bar{background:var(--mint)}
.steps .cur .bar{background:var(--violet)}
.steps .cur{color:var(--ink);font-weight:700}
.slabel{font-size:15px}
@media (max-width:640px){.slabel{font-size:12px}}

.nav{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.status{flex:1;text-align:center;font-weight:700}
.status.ok{color:var(--mint)}
.status.bad{color:var(--coral)}
.btn{border:2.5px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--violet);color:var(--violet-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn.small{padding:6px 12px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--ink);border-radius:10px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.grid.nocode{grid-template-columns:minmax(0,820px);justify-content:center}
.codecard.reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:24px;box-shadow:6px 6px 0 var(--ink)}
.card h2{font-family:var(--head);font-size:28px;font-weight:800;margin:0 0 14px;line-height:1.1}
.why{background:var(--soft);border-radius:14px;padding:14px 16px;margin-bottom:20px}
.why p{margin:0}.why p+p{margin-top:8px}
.why b{font-weight:700}
.lbl{display:block;font-weight:700;margin:16px 0 6px}
.in{width:100%;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:18px}
.in:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 25%,transparent)}
.in.bad{border-color:var(--coral)}
.help{font-size:15px;color:var(--muted);margin:6px 0 0}
.err{color:var(--coral);font-size:15px;font-weight:700;margin:6px 0 0}

.starters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.chip:hover{background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--sun);color:#1E1B3A}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emo{font-size:26px;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.emo[aria-pressed="true"]{border-color:var(--ink);background:var(--sun);box-shadow:2px 2px 0 var(--ink)}

.frow{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:start;margin-bottom:10px}
.frow select,.frow input{width:100%}
.x{border:0;background:none;font-size:22px;line-height:1;padding:10px 8px;cursor:pointer;color:var(--muted);border-radius:8px}
.x:hover{color:var(--coral);background:var(--soft)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:18px}
.type{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:15px}
.type code{font-weight:600}

.crow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:2px dashed var(--line)}
.crow:first-of-type{border-top:0}
.fname{font-family:var(--mono);font-weight:600}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer;font-size:15px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--violet);color:var(--violet-ink)}
.startin{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.startin .in{font-size:16px;padding:6px 10px;max-width:180px}

.mfield{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.mfield h3{margin:0 0 8px;font-family:var(--mono);font-size:16px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;background:var(--card);font-family:var(--mono);font-size:14px}
.tog[aria-pressed="true"]{border-color:var(--ink);background:var(--sun);color:#1E1B3A;box-shadow:2px 2px 0 var(--ink)}
.tog .tick{font-family:var(--body);font-weight:700}
.sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:15px}
.sub .in{font-size:15px;padding:6px 10px;width:auto;flex:1 1 140px}
.sub select.in{flex:0 0 auto}
.talk{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.ins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.ins button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:3px 8px;font-family:var(--mono);font-size:13px;cursor:pointer}

.build{background:var(--soft);border-radius:16px;padding:16px}
.build h3{margin:0 0 10px;font-family:var(--head);font-size:20px}
.newline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--mono);font-size:16px}
.newline input,.newline select{font-family:var(--mono);font-size:16px;border:2px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--card);width:110px}
.newline input.short{width:70px}
.newline input:focus,.newline select:focus{border-color:var(--violet);outline:none}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px}
.obj{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:14px;box-shadow:4px 4px 0 var(--ink)}
.obj.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.obj.pop{animation:none}}
.ohead{display:flex;align-items:center;gap:10px}
.oemoji{font-size:40px;line-height:1}
.ovar{font-family:var(--mono);font-weight:600;font-size:18px}
.ocls{font-size:13px;color:var(--muted)}
.obj .x{position:absolute;right:6px;top:4px}
.ovals{margin:10px 0;padding:0}
.ovals div{display:flex;justify-content:space-between;gap:8px;border-bottom:1.5px dashed var(--line);padding:3px 0;font-family:var(--mono);font-size:14px}
.ovals dt{color:var(--muted)}.ovals dd{margin:0;font-weight:600;overflow-wrap:anywhere;text-align:right}
.ovals .flash dd{animation:flash .8s}
@keyframes flash{0%{background:var(--sun);color:#1E1B3A}100%{background:transparent}}
.omb{display:flex;flex-wrap:wrap;gap:6px}
.omb button{border:2px solid var(--ink);background:var(--card);border-radius:8px;padding:4px 9px;font-family:var(--mono);font-size:13px;cursor:pointer}
.omb button:hover{background:var(--soft)}
.setbox{display:flex;gap:6px;margin-top:8px}
.setbox input{flex:1;min-width:0;font-family:var(--mono);border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)}
.bubble{position:relative;background:var(--sun);color:#1E1B3A;border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:700;margin:10px 0 2px;font-size:15px;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:18px;top:-9px;width:14px;height:14px;background:var(--sun);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.bubble small{font-weight:400;display:block;font-size:12px}
.empty{color:var(--muted);text-align:center;border:2.5px dashed var(--line);border-radius:18px;padding:22px;margin-top:20px}

.codecard{position:sticky;top:16px}
.codehead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.codehead h2{font-family:var(--head);font-size:24px;margin:0;flex:1}
.tabs{display:flex;gap:6px}
.tabs button{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:5px 12px;font-family:var(--mono);font-size:14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
pre.code{margin:0;background:var(--code);color:var(--code-ink);border-radius:18px;padding:18px 0;font-family:var(--mono);font-size:14.5px;line-height:1.6;overflow:auto;max-height:70vh;border:2.5px solid var(--ink)}
.ln{display:block;padding:0 20px;border-left:4px solid transparent;min-height:1.6em}
.ln.hot{background:var(--hot);border-left-color:var(--sun)}
.ln.grow{animation:grow .45s ease-out both}
@keyframes grow{from{opacity:0;transform:translateX(-12px);background:rgba(255,201,60,.4)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ln.grow{animation:none}}
.t-k{color:var(--k)}.t-t{color:var(--ty)}.t-s{color:var(--str)}.t-n{color:var(--num)}.t-c{color:var(--code-dim);font-style:italic}
.legend{font-size:14px;color:var(--muted);margin:10px 4px 0}
.legend span{display:inline-block;width:12px;height:12px;background:var(--sun);border-radius:3px;vertical-align:-1px;margin-right:4px}
.output{margin-top:14px;background:var(--code);color:var(--code-ink);border-radius:14px;padding:12px 16px;font-family:var(--mono);font-size:14px;border:2.5px solid var(--ink);max-height:180px;overflow:auto}
.output b{display:block;color:var(--code-dim);font-family:var(--body);font-weight:700;font-size:13px;margin-bottom:4px}
.output .dim{color:var(--code-dim)}
.ohead>div{min-width:0}.ovar{overflow-wrap:anywhere}
header{flex-wrap:wrap}
.hbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:520px){.frow{grid-template-columns:104px 1fr auto}.card{padding:18px}}
.chal{border:2.5px dashed var(--line);border-radius:16px;padding:12px 16px;margin-top:18px}
.chal h3{margin:0 0 6px;font-family:var(--head);font-size:19px;display:flex;justify-content:space-between;gap:10px}
.chal h3 small{font-family:var(--body);font-size:15px;color:var(--muted)}
.chal ul{list-style:none;margin:0;padding:0}
.chal li{display:flex;gap:10px;align-items:center;padding:4px 0;color:var(--muted)}
.chal li span{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font-weight:700;flex:none}
.chal li.ok{color:var(--ink)}.chal li.ok span{background:var(--mint);border-color:var(--mint);color:#fff}
.chal .win{margin:8px 0 0;font-weight:700;color:var(--mint)}
.turnin{background:var(--soft);border-radius:16px;padding:16px;margin-top:20px}
.turnin h3{margin:0 0 8px;font-family:var(--head);font-size:20px}
.turnin .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.turnin .in{max-width:320px}
.codebtn{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer}
.codebtn[aria-pressed="true"]{background:var(--sun);color:#1E1B3A}
.mback{position:fixed;inset:0;z-index:60;background:rgba(20,18,42,.55);display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);color:var(--ink);border:2.5px solid var(--ink);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.modal h2{font-family:var(--head);font-size:26px;margin:0 0 10px}
.modal p{margin:0 0 12px}
.modal .row{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.words{margin:0}.words div{padding:8px 0;border-bottom:1.5px dashed var(--line)}
.words dt{font-weight:700;font-family:var(--mono)}.words dd{margin:2px 0 0;color:var(--muted)}
.modal textarea{width:100%;height:260px;font-family:var(--mono);font-size:13px;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink)}
#printArea{display:none}
@media print{.wrap,#toastBox,#modalBox{display:none!important}body{background:#fff;color:#000}#printArea{display:block}
  #printArea h1{font-family:var(--head);margin:0 0 4px}#printArea h2{font-size:16px;margin:18px 0 6px}
  #printArea pre{font-family:var(--mono);font-size:10.5pt;white-space:pre-wrap;border:1px solid #888;border-radius:6px;padding:10px;margin:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 24px);z-index:50}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo" aria-hidden="true">🐶</div>
    <div><h1>Class Builder</h1><p>Make your own Java class in five steps, then bring it to life.</p></div>
    <div class="hbtns"><button class="btn small" id="words">📖 Words to know</button><button class="btn small" id="restart">↺ Start over</button></div>
  </header>
  <ol class="steps" id="steps"></ol>
  <div class="nav">
    <button class="btn" id="back">← Back</button>
    <div class="status" id="status" aria-live="polite"></div>
    <button class="btn go" id="next">Next →</button>
    <button class="btn" id="peek">Peek at code</button>
  </div>
  <div class="grid" id="grid">
    <section class="card" id="stepCard"></section>
    <aside class="codecard" id="codeCard">
      <div class="codehead"><h2>Your Java code</h2><div class="tabs" id="tabs" role="tablist"></div></div>
      <pre class="code" id="code" tabindex="0"></pre>
      <p class="legend" id="legend"><span></span>Highlighted lines come from this step.</p>
      <div class="output" id="output" hidden></div>
    </aside>
  </div>
</div>
<div id="toastBox"></div>
<div id="modalBox"></div>
<div id="printArea"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KW = new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws transient try void volatile while true false null var'.split(' '));
const ident = s => /^[A-Za-z_][A-Za-z0-9_]*$/.test(s) && !KW.has(s);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const low = s => s ? s[0].toLowerCase() + s.slice(1) : s;
const jstr = s => '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
const fmtD = v => Number.isInteger(v) ? v.toFixed(1) : String(v);
const STEPS = ['Name', 'Fields', 'Constructor', 'Methods', 'Objects'];
const EMOJIS = ['🐶','🐱','🍕','👾','🏠','🚗','📚','🎒','🦄','🐉','🤖','⚽','🎸'];
const TYPES = {
  String: 'words or text, like "Rex"',
  int: 'whole numbers, like 3',
  double: 'decimal numbers, like 9.5',
  boolean: 'true or false'
};
const STORE = 'class-builder-simple-v1';

let S, nid;
const F = (type, name, ctor = true, start = '') => ({id: nid(), type, name, ctor, start});
function starter(key) {
  const s = {step: 0, emoji: '', name: '', fields: [], methods: [], objects: [], log: [], out: [], sig: '', n: 1, tab: 'class', starter: key};
  S = s; nid = () => 'f' + (S.n++);
  const M = (kind, fid, more = {}) => S.methods.push({id: nid(), kind, fieldId: fid, name: '', op: '+', amount: '1', msg: '', ...more});
  if (key === 'Dog') {
    S.emoji = '🐶'; S.name = 'Dog';
    const n = F('String', 'name'), a = F('int', 'age'); S.fields = [n, a];
    M('get', n.id); M('change', a.id, {name: 'haveBirthday'}); M('talk', '', {name: 'bark', msg: '{name} says Woof!'});
  } else if (key === 'Pizza') {
    S.emoji = '🍕'; S.name = 'Pizza';
    const t = F('String', 'topping'), sl = F('int', 'slices', false, '8'); S.fields = [t, sl];
    M('get', sl.id); M('change', sl.id, {name: 'eatSlice', op: '-'}); M('talk', '', {name: 'describe', msg: 'A {topping} pizza with {slices} slices left.'});
  } else if (key === 'Monster') {
    S.emoji = '👾'; S.name = 'Monster';
    const n = F('String', 'name'), p = F('int', 'power', false, '10'), h = F('boolean', 'hungry'); S.fields = [n, p, h];
    M('change', p.id, {name: 'powerUp', amount: '5'}); M('set', h.id); M('talk', '', {name: 'roar', msg: '{name} roars with power {power}!'});
  } else if (key === 'Student') {
    S.emoji = '🎒'; S.name = 'Student';
    const n = F('String', 'name'), g = F('int', 'grade'), p = F('double', 'gpa'); S.fields = [n, g, p];
    M('get', p.id); M('set', p.id); M('change', g.id, {name: 'nextYear'}); M('talk', '', {name: 'introduce', msg: "Hi, I'm {name} and I'm in grade {grade}."});
  } else if (key === 'House') {
    S.emoji = '🏠'; S.name = 'House';
    const ad = F('String', 'address'), r = F('int', 'rooms'), l = F('boolean', 'lightsOn', false, 'false'); S.fields = [ad, r, l];
    M('get', ad.id); M('change', r.id, {name: 'addRoom'}); M('set', l.id); M('talk', '', {name: 'describe', msg: 'The house at {address} has {rooms} rooms. Lights on: {lightsOn}'});
  } else if (key === 'Book') {
    S.emoji = '📚'; S.name = 'Book';

    cnt[l.sec] = (cnt[l.sec] || 0) + 1;
    const k = S.tab + ':' + l.sec + ':' + cnt[l.sec]; seen.add(k);
    const fresh = shownLines && !shownLines.has(k);
    return `<span class="ln${l.sec === hotSec ? ' hot' : ''}${fresh ? ' grow' : ''}"${fresh ? ` style="animation-delay:${(nFresh++) * 70}ms"` : ''}>${hl(l.t) || ' '}</span>`;
  }).join('');
  shownLines = seen;
  $('#legend').hidden = S.step === 4;
  if (S.tab === 'main') code.scrollTop = code.scrollHeight;
  else { const h = code.querySelector('.hot'); if (h && S.step > 0) code.scrollTop = Math.max(0, h.offsetTop - 40); }
  const out = $('#output');
  out.hidden = S.step !== 4;
  out.innerHTML = '<b>Output</b>' + (S.out.length ? S.out.map(t => `<div>${esc(t)}</div>`).join('') : '<div class="dim">Things your objects print show up here.</div>');
  out.scrollTop = out.scrollHeight;

  S.objects.forEach(o => { o.pop = false; o.flash = null; });
  if (S.step === 4 && S.objects.length) { const L = challenges(); if (L.every(x => x[1]) && !S.won) { S.won = true; setTimeout(() => toast('🎉 All challenges done! Copy or print your code to turn it in.'), 400); } }
  if (keepFocus && key) {
    const el = document.querySelector(key);
    if (el) { el.focus({preventScroll: true}); try { if (ss != null) el.setSelectionRange(ss, ss); } catch (e) {} }
  }
  save();
}
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  $('#toastBox').replaceChildren(d); setTimeout(() => d.remove(), 3800);
}
const sig = () => JSON.stringify([S.name, S.fields, S.methods]);
function goStep(i) {
  if (i > firstBad() || i < 0 || i > 4) return;
  S.step = i;
  if (i === 4) {
    if (S.objects.length && S.sig !== sig()) { S.objects = []; S.log = []; S.out = []; S.did = {}; S.won = false; toast('You changed the class, so the old objects were cleared. Build new ones!'); }
    S.sig = sig();
  }
  render(false);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* ---------- running methods ---------- */
function build() {
  const ps = ctorF(), v = $('#vname').value.trim(), err = $('#berr');
  if (!ident(v)) { err.textContent = 'The variable name needs letters and digits only, starting with a letter.'; return; }
  if (/^[A-Z]/.test(v)) { err.textContent = `Variable names start lowercase: ${low(v)}.`; return; }
  if (S.objects.some(o => o.v === v)) { err.textContent = `You already have an object called ${v}. Pick another name.`; return; }
  const vals = {}, codes = [];
  for (let i = 0; i < ps.length; i++) {
    const r = parse(ps[i].type, document.querySelector(`[data-arg="${i}"]`).value);
    if (r.err) { err.textContent = `${ps[i].name} needs ${r.err}.`; document.querySelector(`[data-arg="${i}"]`).focus(); return; }
    vals[ps[i].id] = r.v; codes.push(r.code);
  }
  S.fields.forEach(f => { if (!f.ctor) vals[f.id] = startOf(f).v; });
  S.objects.push({id: nid(), v, vals, pop: true, bubble: null, setting: null});
  S.log.push({code: `${S.name} ${v} = new ${S.name}(${codes.join(', ')});`, en: `Build a new ${S.name} called ${v}` + (ps.length ? `, with ${ps.map((f, i) => f.name + ' ' + codes[i]).join(' and ')}` : '') + '.'});
  S.tab = 'main';
  const first = S.objects.length === 1 && !S.peek;
  render(false);
  if (first) { const cc = $('#codeCard'); cc.classList.add('reveal'); setTimeout(() => cc.classList.remove('reveal'), 600); toast(`You used your class! Here’s the Java code behind your ${S.name}.`); }
}
function call(mid, oid) {
  const m = S.methods.find(x => x.id === mid), o = S.objects.find(x => x.id === oid), f = field(m.fieldId), n = mName(m);
  if (m.kind === 'set') { o.setting = o.setting === mid ? null : mid; render(false); document.querySelector(`[data-setv="${oid}"]`)?.focus(); return; }
  o.setting = null;
  if (m.kind === 'get') {
    const t = show(f.type, o.vals[f.id]);
    S.log.push({code: `System.out.println(${o.v}.${n}());`, en: `Ask ${o.v} for its ${f.name}, then print it.`});
    S.did = S.did || {}; S.did.get = true;
    S.out.push(f.type === 'String' ? o.vals[f.id] : t);
    o.bubble = {note: `${n}() returned`, text: t};
  }
  if (m.kind === 'change') {
    const amt = parse(f.type, m.amount).v;
    let r = m.op === '+' ? o.vals[f.id] + amt : o.vals[f.id] - amt;
    if (f.type === 'int') r = Math.trunc(r); else r = Math.round(r * 1e9) / 1e9;
    o.vals[f.id] = r; o.flash = f.id;
    S.log.push({code: `${o.v}.${n}();`, en: `Tell ${o.v} to ${n}. Its ${f.name} value goes ${m.op === '+' ? 'up' : 'down'} by ${m.amount.trim()}.`});
    S.did = S.did || {}; S.did.change = true;
    o.bubble = {note: `${f.name} is now`, text: show(f.type, r)};
  }
  if (m.kind === 'talk') {
    const text = m.msg.replace(/\{([^}]*)\}/g, (s, x) => { const ff = S.fields.find(q => q.name === x); return ff ? (ff.type === 'double' ? fmtD(o.vals[ff.id]) : String(o.vals[ff.id])) : s; });
    S.log.push({code: `${o.v}.${n}();`, en: `Tell ${o.v} to ${n}, which prints a message.`}); S.out.push(text);
    S.did = S.did || {}; S.did.talk = true;
    o.bubble = {note: '', text};
  }
  S.tab = 'main';
  render(false);
}
function doSet(oid) {
  const o = S.objects.find(x => x.id === oid), m = S.methods.find(x => x.id === o.setting), f = field(m.fieldId);
  const r = parse(f.type, document.querySelector(`[data-setv="${oid}"]`).value);
  if (r.err) { toast(`${f.name} needs ${r.err}.`); return; }
  o.vals[f.id] = r.v; o.flash = f.id; o.setting = null;
  o.bubble = {note: `${f.name} is now`, text: show(f.type, r.v)};
  S.log.push({code: `${o.v}.${mName(m)}(${r.code});`, en: `Set the ${f.name} of ${o.v} to ${r.code}.`});
  S.did = S.did || {}; S.did.set = true;
  render(false);
}

/* ---------- events ---------- */
function modal(html) {
  $('#modalBox').innerHTML = `<div class="mback"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${html}</div></div>`;
  ($('#modalBox [data-yes]') || $('#modalBox textarea') || $('#modalBox button'))?.focus();
}
let pending = null;
function closeModal() { $('#modalBox').innerHTML = ''; pending = null; }
function ask(title, text, yes, fn) {
  pending = fn;
  modal(`<h2 id="mt">${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button class="btn" data-close>Cancel</button><button class="btn go" data-yes>${esc(yes)}</button></div>`);
}
const WORDS = [
  ['class', 'A blueprint. It describes what every object of that kind knows and can do.'],
  ['object', 'One real thing built from a class. One class can make many objects.'],
  ['field', 'A piece of information every object keeps, like a name or an age. Each object has its own copy.'],
  ['type', 'What kind of value a field holds: String (text), int (whole number), double (decimal), or boolean (true or false).'],
  ['private', 'Only code inside the class can touch it. That’s why we use getters and setters.'],
  ['constructor', 'Code that runs once, when you build an object. It gives every field its first value.'],
  ['new', 'The Java word that builds an object by running the constructor.'],
  ['variable', 'The name you use to talk to an object, like dog1.'],
  ['method', 'Something an object can do. You call it with a dot, like dog1.bark()'],
  ['getter', 'A method that hands back a field’s value, like getName().'],
  ['setter', 'A method that changes a field to a new value, like setAge(5).'],
  ['this', 'Means “this object’s own.” this.name is the object’s field, not the value passed in.'],
  ['System.out.println', 'Prints a line of text to the output.']
];
function allCode() {
  const txt = ls => ls.map(l => l.t).join('\n');
  const who = S.student ? `// By: ${S.student}\n` : '';
  return `${who}// ===== ${S.name}.java =====\n${txt(classLines())}\n\n// ===== Main.java =====\n${txt(mainLines())}` +
    (S.out.length ? `\n\n/* Output:\n${S.out.join('\n')}\n*/` : '');
}
function manualCopy(text) {
  modal(`<h2 id="mt">Copy your code</h2><p>Your browser blocked automatic copying. The code is selected below. Press Ctrl+C (or ⌘+C on a Mac) to copy it.</p><textarea readonly>${esc(text)}</textarea><div class="row"><button class="btn go" data-close>Done</button></div>`);
  const ta = $('#modalBox textarea'); ta.focus(); ta.select();
}
function copyCode() {
  const text = allCode();
  try { navigator.clipboard.writeText(text).then(() => toast('Copied! Paste it into CodeHS or your assignment.'), () => manualCopy(text)); }
  catch (e) { manualCopy(text); }
}
function printWork() {
  const pre = ls => `<pre>${esc(ls.map(l => l.t).join('\n'))}</pre>`;
  $('#printArea').innerHTML = `<h1>${esc(S.emoji)} My ${esc(S.name)} class</h1><p>${S.student ? 'By ' + esc(S.student) + ' · ' : ''}${new Date().toLocaleDateString()}</p>
    <h2>${esc(S.name)}.java</h2>${pre(classLines())}<h2>Main.java</h2>${pre(mainLines())}${S.out.length ? `<h2>Output</h2><pre>${esc(S.out.join('\n'))}</pre>` : ''}`;
  try { window.print(); } catch (e) { toast('Printing isn’t available here. Use Copy my code instead.'); }
}
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('mback')) return closeModal();
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined) return closeModal();
  if (d.yes !== undefined) { const fn = pending; closeModal(); if (fn) fn(); return; }
  if (t.id === 'restart') return ask('Start over?', 'This clears your class and your objects so you can begin fresh. It can’t be undone.', 'Start over', () => {
    try { localStorage.removeItem(STORE); } catch (er) {}
    starter('Dog'); render(false); window.scrollTo({top: 0}); toast('Fresh start! Pick a starting point or type a class name.');
  });
  if (t.id === 'words') return modal(`<h2 id="mt">📖 Words to know</h2><dl class="words">${WORDS.map(([w, m]) => `<div><dt>${esc(w)}</dt><dd>${esc(m)}</dd></div>`).join('')}</dl><div class="row"><button class="btn go" data-close>Got it</button></div>`);
  if (t.id === 'back') return goStep(S.step - 1);
  if (t.id === 'next') return goStep(S.step + 1);
  if (t.id === 'peek') { S.peek = !S.peek; return render(false); }
  if (d.go) return goStep(+d.go);
  if (d.starter) {
    const go = () => {
      const keep = S.step;
      if (d.starter === 'scratch') { starter('scratch'); S.fields = [F('String', 'name')]; S.clean = sig(); }
      else starter(d.starter);
      S.step = keep; render(false);
    };
    if (S.starter === d.starter && !dirty()) return;
    if (dirty()) return ask('Replace your class?', `Switching to ${d.starter === 'scratch' ? 'a blank class' : 'the ' + d.starter + ' starter'} replaces everything you’ve made so far.`, 'Replace it', go);
    return go();
  }
  if (d.emoji) { S.emoji = S.emoji === d.emoji ? '' : d.emoji; return render(); }
  if (d.noemoji !== undefined) { S.emoji = ''; return render(); }
  if (d.act === 'addf') {
    const names = new Set(S.fields.map(f => f.name)); let n = 'field', i = 1; while (names.has(n + i)) i++;
    S.fields.push(F('int', n + i)); render(false);
    const ins = document.querySelectorAll('[data-fk="name"]'); const last = ins[ins.length - 1]; last.focus(); last.select(); return;
  }
  if (d.delf) { S.fields = S.fields.filter(f => f.id !== d.delf); S.methods = S.methods.filter(m => m.fieldId !== d.delf); return render(false); }
  if (d.ctor) { const f = field(d.ctor); f.ctor = d.v === '1'; return render(false); }
  if (d.tog) {
    const ex = S.methods.find(m => m.kind === d.tog && m.fieldId === d.id);
    if (ex) S.methods = S.methods.filter(m => m !== ex);
    else { const f = field(d.id); S.methods.push({id: nid(), kind: d.tog, fieldId: d.id, name: d.tog === 'change' ? 'add' + cap(f.name) : '', op: '+', amount: '1', msg: ''}); }
    return render(false);
  }
  if (d.act === 'addtalk') {
    const names = new Set(S.methods.map(mName)); let n = 'speak', i = 2; while (names.has(n)) n = 'speak' + i++;
    S.methods.push({id: nid(), kind: 'talk', fieldId: '', name: n, op: '+', amount: '1', msg: S.fields[0] ? `Hi! My ${S.fields[0].name} is {${S.fields[0].name}}.` : 'Hello!'});
    return render(false);
  }
  if (d.delm) { S.methods = S.methods.filter(m => m.id !== d.delm); return render(false); }
  if (d.ins) { const m = S.methods.find(x => x.id === d.ins); m.msg += `{${d.f}}`; render(false); const el = document.querySelector(`[data-m="msg"][data-id="${m.id}"]`); el.focus(); el.setSelectionRange(9999, 9999); return; }
  if (d.act === 'build') return build();
  if (d.call) return call(d.call, d.o);
  if (d.doset) return doSet(d.doset);
  if (d.delo) { S.objects = S.objects.filter(o => o.id !== d.delo); return render(false); }
  if (d.act === 'copy') return copyCode();
  if (d.act === 'print') return printWork();
  if (d.act === 'english') { S.en = S.en === false; return render(false); }
  if (d.tab) { S.tab = d.tab; return render(false); }
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.student !== undefined) { S.student = t.value; save(); return; }
  if (d.k === 'name') { S.name = t.value.trim(); S.starter = ''; return render(); }
  if (d.fk) { const f = field(d.id); if (d.fk === 'name') f.name = t.value.trim(); else { f.type = t.value; f.start = ''; S.methods = S.methods.filter(m => !(m.fieldId === f.id && m.kind === 'change' && !['int', 'double'].includes(f.type))); } return render(); }
  if (d.start) { field(d.start).start = t.value; return render(); }
  if (d.m) { S.methods.find(m => m.id === d.id)[d.m] = d.m === 'name' ? t.value.trim() : t.value; return render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalBox').innerHTML) return closeModal();
  if ($('#modalBox').innerHTML) return;
  if (e.key !== 'Enter') return;
  if (e.target.matches('.newline input')) { e.preventDefault(); build(); }
  else if (e.target.matches('[data-setv]')) { e.preventDefault(); doSet(e.target.dataset.setv); }
  else if (e.target.matches('#cname') && !$('#next').disabled) goStep(1);
});

if (!load()) starter('Dog');
render(false);
})();
</script>
